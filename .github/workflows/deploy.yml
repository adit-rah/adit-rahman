name: Deploy to GitHub Pages

# Cloudflare Pages (me.alders.dev) builds and deploys main through its own
# Git integration; this workflow publishes the same commit to
# adit-rah.github.io/adit-rahman/.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE_PATH: /adit-rahman/
      ROUTES: about projects contact resume writeup/pit-eval-bench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      # GitHub Pages has no rewrites, so give each client route its own copy
      # of the app shell; any other path falls through to 404.html.
      - name: Add route entry points
        run: |
          for route in $ROUTES; do
            mkdir -p "dist/$route"
            cp dist/index.html "dist/$route/index.html"
          done
          rm dist/_redirects
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
